<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>修了試験 採点ツール</title>
<style>
:root{--bg:#F2F5F4;--surface:#fff;--ink:#16262A;--muted:#58696C;--line:#D3DCDA;--accent:#1D6B58;--accent-ink:#fff;--warn:#9A4818;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1618;--surface:#162224;--ink:#E6EFED;--muted:#98ABA8;--line:#2A3C3B;--accent:#5CC3A5;--accent-ink:#0B1A17;--warn:#E9A171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 20px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--muted);font-size:13px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rm{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px;color:var(--muted)}
.rm input{width:18px;height:18px;accent-color:var(--accent)}
button{width:100%;min-height:46px;font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#err{min-height:1.5em;margin:10px 0 0;font-size:13px;color:var(--warn)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
<h1>修了試験 採点ツール</h1>
<p>講師用です。パスワードを入力してください。</p>
<label class="f" for="pw">パスワード</label>
<input type="password" id="pw" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label class="rm"><input type="checkbox" id="rm"> この端末では次回から入力を省略する</label>
<button type="button" id="go">開く</button>
<div id="err" role="alert"></div>
</form>

function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
var f=document.getElementById('f'),pw=document.getElementById('pw'),rm=document.getElementById('rm'),go=document.getElementById('go'),err=document.getElementById('err');
async function dec(p){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(S),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(C));
  return new TextDecoder().decode(pt);
}
function open_(html){document.open();document.write(html);document.close();}
async function tryUnlock(p,remember,silent){
  if(!window.crypto||!crypto.subtle){err.textContent='このブラウザでは開けません。https のURLで開き直してください。';return;}

}
